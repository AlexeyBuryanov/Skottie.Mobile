name: Publish to NuGet

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Install mobile workloads
        run: dotnet workload install android ios maui --version 10.0.400.1

      - name: Select package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = $env:RELEASE_TAG -creplace '^v', ''
          # Build metadata is excluded because NuGet ignores it for package identity.
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$') {
            throw "Release tag must be a version such as v1.0.0 or v1.1.0-preview.1."
          }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Pack libraries
        shell: pwsh
        run: |
          $projects = @(
            'src/Skottie.Mobile.Android/Skottie.Mobile.Android.csproj',
            'src/Skottie.Mobile.iOS/Skottie.Mobile.iOS.csproj',
            'src/Skottie.Mobile.Maui/Skottie.Mobile.Maui.csproj'
          )
          foreach ($project in $projects) {
            dotnet pack $project -c Release -o artifacts/packages -p:Version=$env:PACKAGE_VERSION -p:ContinuousIntegrationBuild=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Oleksii_Burianov

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
